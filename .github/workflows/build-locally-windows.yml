# Hand-written (NOT generated by conda-smithy): runs ./build-locally.py on a
# Windows runner, i.e. the exact same code path a maintainer uses locally.
# Packages are never uploaded (build-locally.py forces UPLOAD_PACKAGES=False).

name: Build locally (Windows)

on:
  push:

  workflow_dispatch:
    inputs:
      # config:
      #   description: Which .ci_support/win_*.yaml config to build
      #   type: choice
      #   required: true
      #   default: win_64_freethreadingno
      #   options:
      #     - all
      #     - win_64_freethreadingno
      #     - win_64_freethreadingyes
      #     - win_arm64_freethreadingno
      #     - win_arm64_freethreadingyes
      runs_on:
        description: Runner image
        type: choice
        required: true
        default: windows-2022
        options:
          - windows-2022
          - windows-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Convenience job that turned a single `config` dispatch input (or the value
  # `all`) into a dynamic matrix. Kept for reference -- the build job below now
  # hardcodes all four win configs so they also run on push, where dispatch
  # inputs are unavailable.
  #
  # matrix:
  #   name: Resolve configs
  #   runs-on: ubuntu-latest
  #   outputs:
  #     configs: ${{ steps.resolve.outputs.configs }}
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #
  #     - name: Resolve configs
  #       id: resolve
  #       shell: bash
  #       env:
  #         CONFIG: ${{ inputs.config }}
  #       run: |
  #         set -euo pipefail
  #         if [[ "${CONFIG}" == "all" ]]; then
  #           configs="$(cd .ci_support && ls win_*.yaml | sed 's/\.yaml$//' | jq -R . | jq -sc .)"
  #         else
  #           if [[ ! -f ".ci_support/${CONFIG}.yaml" ]]; then
  #             echo "::error::.ci_support/${CONFIG}.yaml does not exist"
  #             exit 1
  #           fi
  #           configs="$(jq -nc --arg c "${CONFIG}" '[$c]')"
  #         fi
  #         echo "configs=${configs}" >> "$GITHUB_OUTPUT"
  #         echo "Building: ${configs}"

  build:
    name: ${{ matrix.CONFIG }}
    runs-on: ${{ inputs.runs_on || 'windows-2022' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        CONFIG:
          - win_64_freethreadingno
          - win_64_freethreadingyes
          - win_arm64_freethreadingno
          - win_arm64_freethreadingyes
    env:
      # Keep paths short and off the small C: drive -- mirrors what conda-smithy
      # configures for the generated Windows jobs.
      BUILD_PLATFORM: win-64
      CI: github_actions
      CONDA_BLD_PATH: D:\bld
      MINIFORGE_HOME: D:\Miniforge
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d5156d7c80228075 # v6.0.0
        with:
          python-version: '3.12'

      - name: Build ${{ matrix.CONFIG }}
        id: build
        shell: cmd
        env:
          CONFIG: ${{ matrix.CONFIG }}
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%GITHUB_SHA%"
          python build-locally.py %CONFIG%

      - name: Collect built packages
        id: collect
        if: ${{ always() && steps.build.outcome != 'cancelled' }}
        shell: bash
        run: |
          shopt -s nullglob
          pkgs=(/d/bld/*/*.conda /d/bld/*/*.tar.bz2)
          echo "Found ${#pkgs[@]} package(s)"
          printf '%s\n' "${pkgs[@]}"
          if [[ ${#pkgs[@]} -gt 0 ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload built packages
        if: ${{ always() && steps.collect.outputs.found == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: conda_pkgs_${{ matrix.CONFIG }}_${{ github.run_id }}
          path: |
            D:\bld\*\*.conda
            D:\bld\*\*.tar.bz2
          retention-days: 14

      - name: Upload build logs on failure
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: conda_logs_${{ matrix.CONFIG }}_${{ github.run_id }}
          path: |
            D:\bld\**\work\*.log
            D:\bld\**\conda_build.sh
            D:\bld\**\bld.bat
            D:\bld\**\build_env_setup.bat
          if-no-files-found: ignore
          retention-days: 14
